name: klubok
description: "Клубок — помощник для вязания: счётчик рядов, проекты и запасы пряжи."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0
  image_picker: ^1.1.0

flutter:
  uses-material-design: true
  fonts:
    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf
    - family: Balsamiq
      fonts:
        - asset: assets/fonts/BalsamiqSans-Regular.ttf
        - asset: assets/fonts/BalsamiqSans-Bold.ttf
          weight: 700
