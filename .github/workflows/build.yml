name: Собрать APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # В репозитории лежат только свои файлы. Остальную обвязку Android
      # (Gradle и прочее) Flutter дописывает сам; существующие файлы не трогает.
      - name: Дописать файлы Android-проекта
        run: flutter create --platforms=android --org nl.mikem --project-name klubok .

      # Один и тот же ключ подписи при каждой сборке — тогда новая версия
      # ставится поверх старой и записи в приложении не пропадают.
      - name: Постоянный ключ подписи
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: Собрать APK
        run: |
          set -o pipefail
          if ! flutter build apk --release --target-platform android-arm64 2>&1 | tee build.log; then
            msg=$(grep -nE "error:|Error:|What went wrong|^e: |Exception|FAILURE|Could not" build.log | head -50 | tr -d '\r' | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Ошибки сборки::$msg"
            exit 1
          fi

      - name: Переименовать
        run: cp build/app/outputs/flutter-apk/app-release.apk klubok.apk

      - uses: actions/upload-artifact@v4
        with:
          name: klubok-apk
          path: klubok.apk

      # Свежий APK всегда лежит по одной и той же ссылке:
      # https://github.com/<владелец>/<репозиторий>/releases/latest/download/klubok.apk
      - name: Выложить APK по постоянной ссылке
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest klubok.apk \
            --title "Клубок $VER" \
            --notes "Сборка ${GITHUB_SHA::7}. Скачать: https://github.com/${{ github.repository }}/releases/latest/download/klubok.apk" \
            --latest
